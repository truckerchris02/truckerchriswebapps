function plInfo(p){showModal('<div class="row"><div style="flex:none">'+placardSVG(p,110)+'</div><div><b>'+esc(p)+'</b><div class="small" style="margin-top:6px">'+esc(PLDESC[p]||'')+'</div></div></div>');}
function askClear(){showModal('<b>Clear the whole load?</b><div style="margin-top:10px"><button class="btn" onclick="load=[];store.set(\'load\',load);closeModal();render()">Yes, clear it</button></div>');}
function closeModal(){var m=document.getElementById('modal');if(m.style.display==='flex'){m.style.display='none';return true}return false;}
render();
