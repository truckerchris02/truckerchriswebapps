<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TruckerChris">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>TruckerChris Web Apps</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#100e0c;color:#f6f1ea;font:17px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:30px;line-height:1.15;margin:0}
.lede{color:#cbbba8;margin:8px 0 16px}
.how{background:#241c16;border:1px solid #3d3228;border-radius:16px;padding:14px 16px;margin-bottom:18px}
.how b{display:block;margin-bottom:6px}
.how ol{margin:0;padding-left:1.2em}
.how li{margin:4px 0}
.card{display:flex;gap:12px;align-items:center;background:#1c1714;border:1px solid #322922;border-radius:16px;padding:12px;margin:10px 0}
.card img{width:64px;height:64px;border-radius:14px;flex:none;background:#2a221c}
.meta{flex:1;min-width:0}
.meta h2{font-size:18px;margin:0}
.meta p{margin:2px 0 0;color:#cbbba8;font-size:14px}
.ver{color:#a89480;font-size:13px}
a.open{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;background:#e8a24a;color:#2a1a0e;font-weight:800;text-decoration:none}
.group>h2{font-size:15px;line-height:1.2;margin:22px 2px 0;color:#e8a24a;font-weight:800}
.group:first-of-type>h2{margin-top:2px}
footer{color:#8d7d6d;font-size:13px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<h1>TruckerChris Web Apps</h1>
<p class="lede">Install any app on your iPhone. Your data stays in this browser on this device.</p>
<div class="how">
<b>Add an app to your Home Screen</b>
<ol>
<li>Open the app in Safari.</li>
<li>Tap Share.</li>
<li>Tap Add to Home Screen.</li>
</ol>
</div>
<section class="group" aria-labelledby="hubs-h">
<h2 id="hubs-h">All-in-One Hub Apps</h2>
<div id="hub-list"></div>
</section>
<section class="group" aria-labelledby="singles-h">
<h2 id="singles-h">Single Apps</h2>
<div id="single-list"></div>
</section>
<footer>TruckerChris Web Apps</footer>
</div>
<script>
var HUBS=[
{name:"Rig Hub",slug:"rig-hub",version:"1.4",description:"Rig Nav, Trip Logger and Weather in one app"},
{name:"Music Hub",slug:"music-hub",version:"1.4.0",description:"Music and podcast hub with latest/oldest feed sort"}
];
var SINGLES=[
{name:"Truck Health",slug:"truck-health",version:"1.0",description:"Nutrition, water, meds and workouts in one app"},
{name:"Solitaire",slug:"solitaire",version:"1.0",description:"Classic solitaire card game"},
{name:"RigFuel",slug:"rigfuel",version:"1.0",description:"Truck fuel log and tracker"},
{name:"Daily Mantra",slug:"daily-mantra",version:"1.0",description:"Daily money mantras and affirmations with reminders"},
{name:"Hazmat Helper",slug:"hazmathelper",version:"1.0",description:"Hazmat lookup, placards and load segregation checker"},
{name:"Checkers",slug:"checkers",version:"1.0",description:"Checkers vs computer (3 levels) or pass-and-play"},
{name:"StormTrack",slug:"stormtrack",version:"1.0",description:"Location-following weather, severe alerts and live radar"},
{name:"Tandem Slide",slug:"tandemslide",version:"1.0",description:"Tandem axle slide calculator from CAT scale weights"},
{name:"Trip Logger",slug:"triplogger",version:"1.3.5",description:"GPS trip and mileage logger"},
{name:"Pokes Football",slug:"pokes-football",version:"1.0",description:"Oklahoma State football 2026 schedule, rankings and stats"},
{name:"MedMinder",slug:"medminder",version:"1.0",description:"Medication list with dose and refill reminders"},
{name:"Rune Lore",slug:"rune-lore",version:"1.0",description:"Learn the 24 Elder Futhark runes with flashcards and quiz"},
{name:"BandFit",slug:"bandfit",version:"1.0",description:"Light cardio and resistance-band workouts"},
{name:"Truck Cab Nutrition",slug:"truck-cab-nutrition",version:"1.0",description:"Nutrition tracker for life in the truck cab"},
{name:"AutoCare",slug:"autocare",version:"1.3",description:"Personal vehicle maintenance tracker"},
{name:"RigCare",slug:"rigcare",version:"1.2",description:"Truck maintenance tracker"}
];
function byName(a,b){return a.name.localeCompare(b.name);}
function cards(list){return list.sort(byName).map(function(a){
  return '<article class="card"><img src="'+a.slug+'/icons/icon-192.png" alt="" width="64" height="64"><div class="meta"><h2>'+a.name+'</h2><p>'+a.description+'</p><div class="ver">v'+a.version+'</div></div><a class="open" href="'+a.slug+'/">Open</a></article>';
}).join("");}
document.getElementById("hub-list").innerHTML=cards(HUBS);
document.getElementById("single-list").innerHTML=cards(SINGLES);
</script>
</body>
</html>
