<script>
const TID='197',SEASON=2026,E='https://site.api.espn.com/apis/site/v2/sports/football/college-football',C='https://sports.core.api.espn.com/v2/sports/football/leagues/college-football';

    if(done){const w=me.winner;res=`<span class="${w?'W':'L'}">${w?'W':'L'} ${esc(sc(me))}-${esc(sc(op))}</span>`}else if(st.state==='in')res=`<span>${esc(sc(me))}-${esc(sc(op))}</span><div class="muted">${esc(st.shortDetail)}</div>`;
    const rk=op.curatedRank&&op.curatedRank.current<=25?'#'+op.curatedRank.current+' ':'';const lg=op.team.logos&&op.team.logos[0]?op.team.logos[0].href:'';
    h+=`<div class="card g"><img src="${esc(lg)}" onerror="this.style.visibility='hidden'"><div class="n"><b>${c.neutralSite?'vs':home?'vs':'@'} ${esc(rk+op.team.displayName)}</b><span>${esc(dt)}${tv?' · 📺 '+esc(tv):''}</span><br><span>${esc((c.venue&&c.venue.fullName)||'')}${c.neutralSite?' (neutral)':''}</span></div><div class="res">${res}</div></div>`}

function standings(){const s=D.std;if(!s)return'<div class="card">No standings yet. Tap Refresh.</div>';let grp=(s.children||[]).filter(g=>g.standings&&g.standings.entries&&g.standings.entries.length);if(!grp.length)grp=[s];let h='';
  for(const g of grp){const sv=(x,n)=>{const o=x.stats.find(y=>y.type===n);return o&&o.value!=null?+o.value:0};const en=((g.standings&&g.standings.entries)||[]).slice().sort((a,b)=>sv(b,'vsconf_leaguewinpercent')-sv(a,'vsconf_leaguewinpercent')||sv(b,'vsconf_wins')-sv(a,'vsconf_wins')||sv(b,'wins')-sv(a,'wins'));
    h+=`<div class="card"><h3>${esc(g.name||'Big 12')}</h3><table><tr><th>#</th><th>Team</th><th class="r">Conf</th><th class="r">Overall</th></tr>`;
    en.forEach((x,i)=>{const f=n=>{const o=x.stats.find(y=>y.type===n||y.name===n);return o?(o.summary||o.displayValue):'-'};const me=x.team.id===TID;const lg=x.team.logos&&x.team.logos[0]?x.team.logos[0].href:'';
      h+=`<tr class="${me?'me':''}"><td>${i+1}</td><td><img src="${esc(lg)}" onerror="this.style.display='none'">${esc(x.team.shortDisplayName||x.team.displayName)}</td><td class="r">${esc(f('vsconf'))}</td><td class="r">${esc(f('total'))}</td></tr>`});h+='</table></div>'}

function rankings(){const R=D.rank;if(!R)return'<div class="card">No rankings yet. Tap Refresh.</div>';let h='';const tr=rec().rank;
  for(const p of R.rankings||[]){const r=(p.ranks||[]).find(x=>x.team.id===TID),o=(p.others||[]).find(x=>x.team.id===TID);

  if(!(R.rankings||[]).some(p=>/playoff|cfp/i.test(p.name)))h+='<div class="card"><h3>College Football Playoff Ranking</h3><div class="muted">CFP rankings appear here once the committee releases them (usually early November).</div></div>';
  const top=(R.rankings||[])[0];if(top){h+=`<div class="card"><h3>${esc(top.name)} – Top 25</h3><table>`;for(const x of top.ranks||[])h+=`<tr class="${x.team.id===TID?'me':''}"><td>${x.current}</td><td>${esc(x.team.location||x.team.name)}</td><td class="r">${esc(x.recordSummary||'')}</td></tr>`;h+='</table></div>'}

function stats(){const S=D.stats&&D.stats.results&&D.stats.results.stats;let h='';
  const L=D.lead&&D.lead.categories;if(L){h+='<div class="card"><h3>Team Leaders</h3>';for(const c of L){const x=c.leaders&&c.leaders[0];if(!x)continue;h+=`<div class="row"><span>${esc(c.displayName)}</span><span>${esc(x.name||'')}${x.pos?' ('+esc(x.pos)+')':''}</span></div><div class="muted" style="text-align:right">${esc(x.displayValue)}</div>`}h+='</div>'}

  const pick={passing:['Passing',['netPassingYards','completionPct','passingTouchdowns','interceptions','yardsPerPassAttempt','QBRating']],rushing:['Rushing',['rushingYards','yardsPerRushAttempt','rushingTouchdowns','rushingAttempts','longRushing']],miscellaneous:['Offense / Misc',['firstDowns','thirdDownConvPct','fourthDownConvPct','totalPenaltyYards','possessionTimeSeconds','turnOverDifferential']],scoring:['Scoring',['totalPoints','totalPointsPerGame','totalTouchdowns','fieldGoals']],defensive:['Defense',['totalTackles','sacks','tacklesForLoss','passesDefended','stuffs']],defensiveInterceptions:['Interceptions',['interceptions','interceptionYards']],kicking:['Kicking',['fieldGoalsMade','fieldGoalAttempts','fieldGoalPct','longFieldGoalMade']],punting:['Punting',['punts','grossAvgPuntYards']]};
  for(const c of S.categories||[]){const p=pick[c.name];if(!p)continue;const rows=p[1].map(n=>c.stats.find(s=>s.name===n)).filter(Boolean);if(!rows.length)continue;

/* ---------- News (v1.1): Pistols Firing RSS ---------- */
const FEED='https://pistolsfiringblog.com/feed/',WPAPI='https://pistolsfiringblog.com/wp-json/wp/v2/posts?per_page=30&_fields=link,title,date_gmt,excerpt,jetpack_featured_media_url,categories',
  R2J='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(FEED);
let N=JSON.parse(localStorage.getItem('pf_news')||'null')||{items:[]},nErr='',nBusy=false,nFb=localStorage.getItem('pf_nfb')==='1';
const deent=s=>{const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value};
const strip=h=>deent(String(h||'').replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').replace(/\s*(The post .*? appeared first on .*)$/,'').trim();
const cut=(s,n)=>s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':s;
function parseRSS(xml){const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror')&&!doc.querySelector('item'))throw new Error('Feed could not be read');

    const body=tx('content:encoded')||'';if(!img){const m=body.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)img=m[1]}
    return{t:deent(tx('title')).trim(),l:tx('link').trim(),d:Date.parse(tx('pubDate'))||0,x:cut(strip(tx('description')||body),220),img:img.replace(/^http:/,'https:'),
      c:[...it.getElementsByTagName('category')].map(e=>e.textContent.trim()),a:tx('dc:creator').trim()}})}
function fromWP(a){return a.map(p=>({t:deent(p.title&&p.title.rendered||'').trim(),l:p.link,d:Date.parse((p.date_gmt||'')+'Z')||0,x:cut(strip(p.excerpt&&p.excerpt.rendered),220),img:p.jetpack_featured_media_url||'',c:[],a:''}))}

function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'}

document.getElementById('m').addEventListener('click',e=>{const a=e.target.closest('a.nw');if(a){e.preventDefault();openLink(a.dataset.l);return}
