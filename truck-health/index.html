 h+='<div class="card"><h2>Add my own food</h2><label>Name</label><input id="nf-name" placeholder="Mom\'s chili"><div class="g">'+[['cal','Calories'],['p','Protein g'],['na','Sodium mg'],['c','Carbs g'],['f','Fat g']].map(function(f){return '<div><label>'+f[1]+'</label><input type="number" inputmode="numeric" id="nf-'+f[0]+'"></div>'}).join('')+'</div><p><button onclick="addCustom()">Save and log it</button></p>'+

 h+='<div class="card" style="text-align:center"><h2>💧 Water today</h2><div class="big" style="font-size:64px;color:#6fb1ff">'+w+'<span style="font-size:24px;color:#b3a3a6"> / '+g+'</span></div><div class="muted">bottles of '+db.water.oz+' oz · '+(w*db.water.oz)+' oz total</div><div class="drops">'+Array(Math.min(g,16)+1).join('·').split('').map(function(_,i){return i<w?'💧':'○'}).join('')+'</div>'+bar('Daily goal',w,g,'bottles',0,'w')+
  '<div class="row"><button class="wat" style="flex:2;padding:16px" onclick="addW(1)">+1 bottle</button><button class="sec" style="flex:1;padding:16px" onclick="addW(-1)">−1</button></div></div>';
 h+='<div class="card"><h3>Goal</h3><div class="g"><div><label>Bottles per day</label><input type="number" inputmode="numeric" value="'+g+'" onchange="setGoal(\'water\',this.value)"></div><div><label>Bottle size</label><select onchange="db.water.oz=+this.value;save();render()">'+[8,12,16,20,24,32].map(function(o){return '<option value="'+o+'"'+(db.water.oz==o?' selected':'')+'>'+o+' oz</option>'}).join('')+'</select></div></div></div>';
 h+='<div class="card"><h3>Water reminders</h3><div class="row" style="margin-top:8px"><input type="checkbox" id="hon" '+(r.on?'checked':'')+' onchange="setWR()"><span>Remind me to drink water</span></div><div class="g"><div><label>From</label><input type="time" id="hs1" value="'+esc(r.s)+'" onchange="setWR()"></div><div><label>Until</label><input type="time" id="he1" value="'+esc(r.e)+'" onchange="setWR()"></div><div><label>Every</label><select id="hev" onchange="setWR()">'+[[30,'30 min'],[45,'45 min'],[60,'1 hour'],[90,'1.5 hours'],[120,'2 hours'],[180,'3 hours']].map(function(o){return '<option value="'+o[0]+'"'+(r.every==o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div></div><div class="muted" style="margin-top:6px">Skipped once you hit your goal for the day.'+(AB?'':' Reminders only show while the app is open on this iPhone.')+'</div>'+(AB?'<button class="sec" style="margin-top:8px" onclick="AB.testNotif(\'water\')">Test water reminder</button>':'')+'</div>';
 var dd=[],mx=g;for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=today(d),v=db.water.days[k]||0;dd.push([k,v]);mx=Math.max(mx,v)}

// ---------- MEDS ----------
function daysLeft(m){var per=(+m.perDose||1)*(m.times||[]).length;return per>0?(+m.onHand||0)/per:Infinity}
function isLow(m){return m.thrMode=='count'?(+m.onHand||0)<=(+m.thr||0):daysLeft(m)<=(+m.thr||0)}
function logDose(m){var d=today();(db.medlog[d]=db.medlog[d]||{})[m.id]=(db.medlog[d][m.id]||0)+1}
function pull(){if(!(AB&&AB.pullTaken))return;try{var q=JSON.parse(AB.pullTaken());q.forEach(function(e){var m=db.meds.find(function(x){return x.id==e.id});if(m){m.onHand=Math.max(0,(+m.onHand||0)-(+m.perDose||1));logDose(m)}});if(q.length){save();render()}}catch(e){}}
function taken(id){var m=db.meds.find(function(x){return x.id==id});if(!m)return;m.onHand=Math.max(0,(+m.onHand||0)-(+m.perDose||1));logDose(m);save();render();if(isLow(m))setTimeout(function(){alert('Time to refill '+m.name+': '+m.onHand+' left')},50)}
function refilled(id){var m=db.meds.find(function(x){return x.id==id});var n=prompt('How many pills did you add?',m.lastRefill||30);if(n==null)return;n=+n;if(!(n>0))return;m.lastRefill=n;m.onHand=(+m.onHand||0)+n;save();render()}

 db.meds.forEach(function(m){var dl=daysLeft(m),low=isLow(m),n=tl[m.id]||0;
  h+='<div class="card"><div class="row"><div style="flex:1"><h3>'+esc(m.name)+'</h3><div class="muted">'+esc(m.dose)+(m.notes?' · '+esc(m.notes):'')+'</div></div><button class="sec" onclick="edit(\''+m.id+'\')">Edit</button></div>'+
  '<div style="margin:8px 0">'+(m.times||[]).map(function(t,i){return '<span class="t'+(i<n?' done':'')+'">'+(i<n?'✓ ':'⏰ ')+t+'</span>'}).join('')+'</div>'+
  '<div class="'+(m.onHand<=0?'bad':low?'low':'muted')+'">'+(+m.onHand||0)+' pills on hand · '+(isFinite(dl)?Math.floor(dl)+' days left':'—')+(low?' · REFILL SOON':'')+'</div>'+
  (m.pharmacy||m.phone?'<div class="muted">'+esc(m.pharmacy)+' '+(m.phone?'<a href="tel:'+esc(m.phone)+'">'+esc(m.phone)+'</a>':'')+'</div>':'')+
  '<div class="row" style="margin-top:10px"><button style="flex:2" onclick="taken(\''+m.id+'\')">✓ Taken ('+n+'/'+(m.times||[]).length+' today)</button><button class="sec" style="flex:1" onclick="refilled(\''+m.id+'\')">Refilled</button></div></div>'});
 if(AB)h+='<div class="card"><div class="row wrap"><button class="sec" style="flex:1" onclick="AB.openBatterySettings()">Battery settings</button><button class="sec" style="flex:1" onclick="AB.testNotif(\'refillcheck\')">Check refills now</button></div><div class="muted" style="margin-top:6px">Set Truck Health to “Unrestricted” battery so reminders are never delayed.</div></div>';
 else h+='<div class="card muted">On the desktop, dose and refill reminders only show while Truck Health is open. Rely on the phone app for reminders.</div>';
 return h}

function start(id){var r=rt(id);W={r:r,st:steps(r),i:0,ph:'ready',left:5,t0:Date.now(),pause:false,rest:db.wo.rest||r.rest||30};beep(660,120);try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(w){window.__wl=w}).catch(function(){})}catch(e){}document.getElementById('wo').classList.add('on');clearInterval(W.iv);W.iv=setInterval(tick,1000);draw()}
function tick(){if(!W||W.pause)return;if(W.ph=='work'&&!W.cur.secs)return;W.left--;if(W.left<=3&&W.left>0){beep(880,120)}if(W.left<=0)adv();else draw()}
function adv(){if(W.ph=='ready'||W.ph=='rest'){W.ph='work';W.cur=W.st[W.i];W.left=W.cur.secs||0;beep(1200,350);buzz(400)}
 else{W.i++;if(W.i>=W.st.length)return finish();W.ph='rest';W.left=W.rest;beep(500,300);buzz(200)}draw()}

function finish(){clearInterval(W.iv);var min=(Date.now()-W.t0)/60000,n=new Date();db.wo.log.push({n:W.r.n,d:today(),tm:('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2),min:Math.max(1,Math.round(min)),cnt:W.r.items.length});save();markDone();beep(1000,200);setTimeout(function(){beep(1300,400)},250);buzz(600);
 document.getElementById('wo').innerHTML='<div style="text-align:center;margin-top:20vh"><div style="font-size:70px">🎉</div><h2>Workout complete!</h2><p class="muted">'+esc(W.r.n)+' · '+Math.round(min)+' min</p><p>🔥 Streak: <b>'+streak()+' day'+(streak()==1?'':'s')+'</b></p></div><div class="wb"><button onclick="quit(1)">Done</button></div>'}

 else{h+='<div class="phase">'+(c.e.k=='c'?'CARDIO':'BANDS')+(c.sets>1?' · SET '+c.set+' OF '+c.sets:'')+'</div><h2 style="text-align:center;margin-top:8px">'+esc(c.e.n)+'</h2>'+(c.secs?'<div class="big">'+fmt(W.left)+'</div>':'<div class="big">'+c.reps+'<span style="font-size:24px"> reps</span></div><div class="muted" style="text-align:center">Tap “Done set” when finished</div>')+'<div class="card" style="margin-top:10px"><div class="muted">'+esc(c.e.mus)+(c.e.k=='b'?' · Band: '+esc(c.e.band):'')+'</div><div style="margin-top:6px">'+esc(c.e.how)+'</div></div>'}

 var bars='',mx=1,dd=[];for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=today(d),m=db.wo.log.filter(function(l){return l.d==k}).reduce(function(a,l){return a+(l.min||0)},0);dd.push([k,m]);mx=Math.max(mx,m)}
 h+='<div class="card"><div class="muted">Minutes, last 14 days</div><div style="display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px">'+dd.map(function(x){return '<div title="'+x[0]+'" style="flex:1;background:'+(x[1]?'#FF6B35':'#2f2643')+';height:'+Math.max(4,x[1]/mx*88)+'px;border-radius:3px"></div>'}).join('')+'</div></div>';

function exp(){var s=JSON.stringify(db,null,1),fn='TruckHealth-backup-'+(today())+'.json';

 if(!dl(s,fn))alert('Could not save the backup file');}
function dl(s,fn){try{var u=URL.createObjectURL(new Blob([s],{type:'application/json'}));var a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return true;}catch(e){return false}}
function doImp(inp){var fl=inp.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){inp.value='';var o;try{o=JSON.parse(r.result)}catch(e){return alert('That file is not a valid backup')}

 else if(o&&Array.isArray(o.meds)){if(!confirm('Import MedMinder backup ('+o.meds.length+' meds)? This replaces your meds list.'))return;db.meds=o.meds;var ml=o.log||{};Object.keys(ml).forEach(function(k){db.medlog[k]=ml[k]})}
 else if(o&&Array.isArray(o.log)){if(!confirm('Import BandFit backup ('+o.log.length+' workouts, '+(o.custom||[]).length+' custom routines)? This replaces your workout data.'))return;db.wo=fix({wo:o}).wo}
 else return alert('That file is not a Truck Health, MedMinder or BandFit backup');
 save();render();alert('Backup restored')};r.readAsText(fl)}
