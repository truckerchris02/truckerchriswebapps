<title>Daily Mantra v1.0</title><style>
:root{--bg:#1d1612;--card:#2b211b;--ac:#e8a24a;--ac2:#d9774b;--tx:#f5e9dc;--mu:#b9a593}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(135deg,#3a2418,#2a1c14);display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px;color:var(--ac)}.ver{font-size:12px;color:var(--mu)}
main{padding:14px;max-width:760px;margin:auto}.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0006}
.lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ac)}.q{font-size:21px;line-height:1.4;margin:10px 0}.cat{font-size:12px;color:var(--mu)}
button{background:#3a2b22;color:var(--tx);border:1px solid #5a4333;border-radius:10px;padding:8px 12px;font-size:14px;margin:3px;cursor:pointer}
button.p{background:var(--ac);color:#2a1a0e;border:none;font-weight:bold}
input,select,textarea{background:#140f0c!important;color:var(--tx)!important;border:1px solid #5a4333;border-radius:8px;padding:8px;font-size:15px;width:100%;color-scheme:dark}
option{background:#140f0c;color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#140f0c;border-top:1px solid #3a2b22;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border:none;border-radius:0;background:none;padding:12px 2px;font-size:13px;color:var(--mu)}nav button.on{color:var(--ac)}
.it{border-bottom:1px solid #3a2b22;padding:10px 0;display:flex;gap:8px;align-items:center}.it span{flex:1}
.st{font-size:30px;color:var(--ac);text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ac);color:#2a1a0e;padding:8px 14px;border-radius:20px;display:none}
</style></head><body>
<header><h1>☀ Daily Mantra</h1><span class="ver">v1.0</span></header><main id="m"></main>
<nav><button data-t="today">Today</button><button data-t="money">Money</button><button data-t="aff">Affirm</button><button data-t="fav">Favorites</button><button data-t="set">More</button></nav>
<div id="toast"></div>
<script>const DATA={"money": {"Abundance": ["Money flows to me in steady, reliable ways.", "I am open to receiving more than I expected.", "There is enough for me and enough to share.", "Abundance follows the work of my hands.", "Every mile I drive moves me toward plenty.", "I see opportunity where others see roadblocks.", "My life is rich in ways that count and ways I can count.", "I welcome new streams of income with open arms.", "Good fortune knows my name and my route.", "I deserve a full tank, a full fridge, and a full account.", "Prosperity is a habit I build one day at a time.", "I attract chances to grow my wealth.", "The more I give thanks, the more I seem to have.", "Money is a tool, and I use it with skill.", "I am building a life of security and comfort.", "Plenty is coming down the road toward me.", "My future is funded by the choices I make today.", "I release scarcity and choose a mindset of more.", "I am a magnet for fair pay and good deals.", "Wealth grows quietly when I tend it daily.", "I have everything I need to create what I want.", "My bank balance reflects my steady effort."], "Saving": ["Every dollar I save is a brick in my foundation.", "I pay myself first, every single payday.", "Small savings add up to big freedom.", "I can enjoy life and still put money aside.", "My emergency fund grows stronger each week.", "I choose long-term peace over short-term spending.", "Packing my own meals is money in my pocket.", "I am proud of the money I keep.", "Saving is a gift to the future me.", "I know where my money goes, and I tell it where to go.", "I skip the impulse buy and keep the win.", "Every receipt I track makes me wiser.", "My savings are a cushion for the bumps in the road.", "I am patient with my money and it rewards me.", "A cheaper fuel stop today is a stronger account tomorrow.", "I find joy in simple, low-cost pleasures.", "My retirement is being built right now.", "I save with purpose and spend with intention.", "I treat my savings goals like delivery appointments: I keep them.", "Each month I keep a little more than the last."], "Earning": ["My skills and miles are valuable, and I am paid well for them.", "I am worth every dollar I earn.", "Hard work and smart choices raise my income.", "I take the loads and opportunities that serve me best.", "I speak up for the pay I deserve.", "My reputation for reliability brings me better work.", "I am always learning ways to earn more.", "Safe driving is good business, and I am a pro.", "My income is growing steadily and surely.", "Doors open for me because I show up and deliver.", "I turn time behind the wheel into a better life at home.", "I am confident negotiating my rates.", "I earn with honesty and I sleep well at night.", "Each delivery is proof of what I can do.", "My work feeds my family and builds my future.", "I attract good dispatchers, good lanes, and good pay.", "New ideas for income come to me easily.", "I value my time, and others value it too.", "Every paycheck is a reward for my dedication.", "My earning power grows with my experience."], "Debt-Free": ["I am paying off my debt one payment at a time.", "Every payment I make sets me freer.", "I am closer to debt-free today than yesterday.", "I owe less and own more every month.", "I face my bills with courage, not fear.", "My debts are shrinking and my options are growing.", "I celebrate every balance that hits zero.", "I borrow wisely or not at all.", "Freedom from debt is my destination, and I'm on the route.", "I make a plan and I stick to the plan.", "My credit score rises as I keep my word.", "I choose cash and calm over credit and stress.", "I am breaking old money patterns for good.", "Interest works for me, not against me.", "I am allowed to say no to spending that doesn't serve me.", "Each extra payment is a mile marker toward freedom.", "I picture my last payment and smile.", "I release shame about past debt and focus on progress.", "My future self thanks me for paying this down today.", "Debt does not define me; my actions do."], "Gratitude for Money": ["I am thankful for every dollar that comes to me.", "I bless the money I spend and the money I keep.", "Thank you for the paycheck that keeps my family safe.", "I am grateful for the fuel in my tank and the food on my table.", "I appreciate the work that pays my bills.", "Gratitude turns what I have into enough.", "I am thankful for the roof over my head.", "Every bill I can pay is a reason to be grateful.", "I give thanks for the customers and loads that support me.", "I am grateful for lessons money has taught me.", "Thank you for small wins and unexpected savings.", "I appreciate the security I've built so far.", "My heart is full when I can help someone in need.", "I am grateful for a steady job on the open road.", "I honor money by using it wisely.", "Thank you for the freedom my earnings give me.", "I notice and appreciate abundance all around me.", "I am grateful for today's opportunity to earn.", "Thankfulness makes my money go further.", "I count my blessings before I count my cash."]}, "aff": {"Confidence": ["I am capable, skilled, and ready for today.", "I trust my judgment behind the wheel and in life.", "I handle whatever the day brings.", "I am proud of who I am becoming.", "My experience is my strength.", "I deserve respect, and I give it freely.", "I speak with calm confidence.", "I have done hard things before, and I can do them again.", "I believe in myself, even on the tough days.", "I am a professional, and it shows.", "My voice matters.", "I meet challenges head-on.", "I am exactly where I need to be to grow.", "I am enough, just as I am.", "My confidence grows with every mile.", "I bring value wherever I go.", "I don't need to be perfect to be great.", "I stand tall in who I am."], "Health": ["I nourish my body with good food and clean water.", "Every healthy choice I make adds up.", "I move my body today, even if it's just a stretch at a stop.", "My body is strong and getting stronger.", "I drink my water and thank my body for carrying me.", "I rest when I need to, and I wake refreshed.", "I take my medications and care for myself with pride.", "My heart is healthy and my mind is clear.", "I choose the salad sometimes, and that's a win.", "I listen to what my body tells me.", "I deserve to feel good in my own skin.", "Good sleep is part of my job, and I protect it.", "My health is worth more than any load.", "I am gentle with myself as I build better habits.", "Each walk around the truck is a little gift to my heart.", "I breathe deeply and feel energy fill me.", "I am healing, growing, and thriving.", "Healthy me is happy me."], "Calm": ["I breathe in peace and breathe out tension.", "Traffic does not control my mood; I do.", "I stay calm and steady, like a heavy load on a level road.", "I let go of what I can't control.", "My mind is quiet, and my hands are steady.", "I take life one mile at a time.", "Delays are part of the trip, and I accept them with grace.", "I choose patience over frustration.", "Peace starts with my next breath.", "I release today's worries before I sleep.", "Nothing is worth risking my calm.", "I respond instead of react.", "I am at ease, wherever I am parked.", "Stillness is always available to me.", "I can slow down and still arrive.", "My calm keeps me and everyone around me safe.", "I trust that things are working out.", "Quiet moments recharge my spirit."], "Gratitude": ["I am grateful for this new day.", "Thank you for the people who love me.", "I appreciate the sunrise over the highway.", "I am thankful for my health, my work, and my home.", "I notice the small good things today.", "Gratitude makes every road feel shorter.", "I am thankful for a safe trip and a safe return.", "I appreciate the kindness of strangers.", "Today I count blessings, not problems.", "I am grateful for the strength to keep going.", "Thank you for the lessons hidden in hard days.", "I appreciate my family's support while I'm away.", "I am thankful for good coffee and good music.", "Every mile is a chance to see something beautiful.", "I give thanks for second chances.", "I am grateful for what I have right now.", "My heart is open and thankful.", "Gratitude is my fuel."], "Strength on the Road": ["I am a safe, focused, and professional driver.", "Every load I deliver keeps the country moving.", "I respect the road, and the road respects me.", "Long miles build a strong spirit.", "I am never truly alone; my people are with me in spirit.", "I drive with patience and arrive with pride.", "Weather, traffic, and detours don't shake me.", "I keep my eyes on the road and my mind on safety.", "I am the steady hand at the wheel.", "Home is waiting, and I'll get there safely.", "I am tough enough for the long haul and kind enough for the small moments.", "My pre-trip check is a promise to everyone on the road.", "I handle tight docks and tight schedules with skill.", "I take breaks because a rested driver is a strong driver.", "The open road reminds me how big my world can be.", "I carry more than freight; I carry pride in my work.", "Each new state is a new chance for a good day.", "Safe miles are my best miles.", "When I'm tired, I rest. When I'm rested, I roll.", "I bring a positive attitude to every truck stop."], "Strength & Purpose": ["I am resilient and I bounce back.", "Every setback is a setup for a comeback.", "I have a purpose, and I live it daily.", "I am stronger than any excuse.", "My family is proud of me, and I am proud of me.", "I keep my word, to others and to myself.", "Discipline today, freedom tomorrow.", "I grow through what I go through.", "I finish what I start.", "I am the driver of my own life.", "Hard roads lead to beautiful places.", "I choose to keep moving forward.", "I lift others up as I rise.", "My best days are still ahead of me.", "Today I make my future self proud."]}};</script><script src="bridge.js"></script><script>
const B=window.Bridge;const K='dm_state';let S=JSON.parse(localStorage.getItem(K)||'{}');
S.fav=S.fav||[];S.own=S.own||{money:[],aff:[]};S.days=S.days||[];S.rem=S.rem||{on:false,time:'07:00'};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const NAME={money:'Money Mantras',aff:'Daily Affirmations'};
function all(sec){let r=[];for(const c in DATA[sec])DATA[sec][c].forEach(t=>r.push({t,c}));S.own[sec].forEach(t=>r.push({t,c:'My Own'}));return r}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function h(s){let x=2166136261;for(const ch of s){x^=ch.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}
let off={money:0,aff:0},tab='today',browse={money:null,aff:null};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function copy(t){if(B&&B.copy){B.copy(t)}else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{})}toast('Copied')}
function share(t){if(B&&B.share)B.share(t);else copy(t)}
function isFav(t){return S.fav.includes(t)}function tf(t){S.fav=isFav(t)?S.fav.filter(x=>x!==t):[...S.fav,t];save();render()}
function pick(sec){const a=all(sec);return a[(h(today()+sec)+off[sec])%a.length]}
function streak(){const d=today();if(!S.days.includes(d)){S.days.push(d);S.days=S.days.slice(-400);save()}let n=0,x=new Date();
 for(;;){const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');if(S.days.includes(k)){n++;x.setDate(x.getDate()-1)}else break}return n}
function acts(t){const e=esc(t).replace(/'/g,'&#39;');return `<div class="row"><button onclick="tf(this.dataset.t)" data-t="${esc(t)}">${isFav(t)?'★ Saved':'☆ Favorite'}</button><button onclick="copy(this.dataset.t)" data-t="${esc(t)}">Copy</button><button onclick="share(this.dataset.t)" data-t="${esc(t)}">Share</button></div>`}
function card(sec,label){const x=pick(sec);return `<div class="card"><div class="lbl">${label}${off[sec]?'':' of the day'}</div><div class="q">“${esc(x.t)}”</div><div class="cat">${x.c}</div>${acts(x.t)}<div class="row"><button onclick="off.${sec}=Math.floor(Math.random()*999)+1;render()">🔀 Shuffle</button><button onclick="off.${sec}++;render()">Next ›</button>${off[sec]?`<button onclick="off.${sec}=0;render()">Today's</button>`:''}</div></div>`}
function V_today(){return `<div class="card"><div class="st">🔥 ${streak()} day streak</div><div class="cat" style="text-align:center">${new Date().toDateString()}</div></div>`+card('money','💰 Money mantra')+card('aff','🌅 Affirmation')}
function V_sec(sec){const c=browse[sec];if(!c){const cats=[...Object.keys(DATA[sec]),'My Own'];return `<div class="card"><div class="lbl">${NAME[sec]}</div>`+cats.map(k=>`<div class="it"><span>${k}</span><span class="cat" style="flex:0">${k=='My Own'?S.own[sec].length:DATA[sec][k].length}</span><button onclick="browse.${sec}='${k}';render()">Open</button></div>`).join('')+`</div><div class="card"><div class="lbl">Add your own</div><textarea id="nw" rows="2" placeholder="Write your own ${sec=='money'?'mantra':'affirmation'}..."></textarea><button class="p" onclick="addOwn('${sec}')">Add</button></div>`}
 const L=c=='My Own'?S.own[sec]:DATA[sec][c];return `<div class="card"><button onclick="browse.${sec}=null;render()">‹ Back</button><div class="lbl" style="margin-top:8px">${c}</div>`+(L.length?L.map((t,i)=>`<div class="it"><span>${esc(t)}</span><button data-t="${esc(t)}" onclick="tf(this.dataset.t)">${isFav(t)?'★':'☆'}</button><button data-t="${esc(t)}" onclick="copy(this.dataset.t)">⧉</button>${c=='My Own'?`<button onclick="delOwn('${sec}',${i})">✕</button>`:''}</div>`).join(''):'<p class="cat">Nothing here yet. Add your own below the categories.</p>')+'</div>'}
function addOwn(sec){const v=document.getElementById('nw').value.trim();if(!v)return;S.own[sec].push(v);save();toast('Added');render()}
function delOwn(sec,i){if(confirm('Delete this one?')){S.own[sec].splice(i,1);save();render()}}
function V_fav(){return `<div class="card"><div class="lbl">Favorites (${S.fav.length})</div>`+(S.fav.length?S.fav.map(t=>`<div class="it"><span>${esc(t)}</span><button data-t="${esc(t)}" onclick="share(this.dataset.t)">Share</button><button data-t="${esc(t)}" onclick="tf(this.dataset.t)">✕</button></div>`).join(''):'<p class="cat">Tap ☆ on any mantra or affirmation to save it here.</p>')+'</div>'}
function V_set(){let r='';if(B){r=`<div class="card"><div class="lbl">Daily reminder</div><div class="row"><select id="ron"><option value="0" ${S.rem.on?'':'selected'}>Off</option><option value="1" ${S.rem.on?'selected':''}>On</option></select><input type="time" id="rt" value="${S.rem.time}"></div><button class="p" onclick="setRem()">Save reminder</button><p class="cat">${B.status?B.status():''}</p></div>`}
 return r+`<div class="card"><div class="lbl">Backup & restore</div><p class="cat">Backup copies your favorites, your own entries, streak and settings as text (JSON). Save it somewhere safe. To restore, paste it below.</p><button class="p" onclick="backup()">Backup (copy/share)</button><textarea id="rs" rows="4" placeholder="Paste backup JSON here"></textarea><button onclick="restore()">Restore</button></div><div class="card"><div class="lbl">About</div><p>Daily Mantra v1.0<br><span class="cat">${all('money').length} money mantras · ${all('aff').length} affirmations</span></p></div>`}
function setRem(){S.rem={on:document.getElementById('ron').value=='1',time:document.getElementById('rt').value||'07:00'};save();const [hh,mm]=S.rem.time.split(':').map(Number);B.setReminder(S.rem.on,hh,mm);toast(S.rem.on?'Reminder set for '+S.rem.time:'Reminder off');setTimeout(render,800)}
function backup(){const j=JSON.stringify({app:'DailyMantra',v:1,state:S});if(B&&B.share)B.share(j);else copy(j)}
function restore(){try{const o=JSON.parse(document.getElementById('rs').value);if(!o.state)throw 0;S=o.state;S.fav=S.fav||[];S.own=S.own||{money:[],aff:[]};S.days=S.days||[];S.rem=S.rem||{on:false,time:'07:00'};save();if(B&&S.rem.on){const [a,b]=S.rem.time.split(':').map(Number);B.setReminder(true,a,b)}toast('Restored');render()}catch(e){alert('That doesn\'t look like a Daily Mantra backup.')}}
function render(){const m=document.getElementById('m');m.innerHTML=tab=='today'?V_today():tab=='money'?V_sec('money'):tab=='aff'?V_sec('aff'):tab=='fav'?V_fav():V_set();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;window.scrollTo(0,0);render()});
window.__back=()=>{if((tab=='money'||tab=='aff')&&browse[tab]){browse[tab]=null;render();return true}if(tab!='today'){tab='today';render();return true}return false};
render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});</script>
</body></html>
